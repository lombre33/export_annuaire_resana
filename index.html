<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resana Scraper - Grist Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 13px;
            opacity: 0.9;
        }

        .widget-content {
            padding: 30px;
        }

        section {
            margin-bottom: 25px;
        }

        h2 {
            font-size: 16px;
            color: #667eea;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #555;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            margin-top: 5px;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #startScrapeBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        #startScrapeBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        #startScrapeBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #resetBtn {
            background: #f0f0f0;
            color: #333;
        }

        #resetBtn:hover {
            background: #e0e0e0;
        }

        /* PROGRESS SECTION */
        #progressSection {
            display: none;
            text-align: center;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        #progressFill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        #progressText {
            font-size: 13px;
            color: #666;
            margin-bottom: 15px;
        }

        #statusMessage {
            font-size: 14px;
            color: #667eea;
            font-weight: 500;
            margin-bottom: 10px;
        }

        /* RESULTS SECTION */
        #resultsSection {
            display: none;
        }

        #resultsSummary {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-box {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-size: 13px;
        }

        .stat-box strong {
            display: block;
            font-size: 20px;
            color: #667eea;
            margin-bottom: 4px;
        }

        .stat-box span {
            color: #999;
        }

        #alertsSection {
            display: none;
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 6px;
            padding: 12px;
            margin-top: 15px;
        }

        #alertsSection h3 {
            color: #856404;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .alert-item {
            color: #856404;
            font-size: 12px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 193, 7, 0.3);
        }

        .alert-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <header>
            <h1>🔄 Resana Scraper</h1>
            <p class="subtitle">Extraction automatique de l'annuaire vers Grist</p>
        </header>

        <div class="widget-content">
            <!-- CONFIG SECTION -->
            <section id="configSection">
                <h2>⚙️ Configuration</h2>

                <div class="form-group">
                    <label for="maxContacts">Nombre maximum de contacts :</label>
                    <input type="number" id="maxContacts" value="500" min="1" max="10000">
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="extractOrganisation" checked>
                        Extraire l'organisation
                    </label>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="extractPerimetres" checked>
                        Extraire les périmètres (max 15)
                    </label>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="extractCompetences" checked>
                        Extraire les compétences (max 15)
                    </label>
                </div>

                <div class="button-group">
                    <button id="startScrapeBtn">▶️ Démarrer l'extraction</button>
                    <button id="resetBtn">↻ Réinitialiser</button>
                </div>
            </section>

            <!-- PROGRESS SECTION -->
            <section id="progressSection">
                <h2>📊 Progression</h2>
                <div class="progress-bar">
                    <div id="progressFill"></div>
                </div>
                <div id="progressText">0/0 contacts</div>
                <div id="statusMessage">Préparation...</div>
            </section>

            <!-- RESULTS SECTION -->
            <section id="resultsSection">
                <h2>✅ Résultats</h2>
                <div id="resultsSummary"></div>

                <div class="stats-grid">
                    <div class="stat-box">
                        <strong id="statContacts">0</strong>
                        <span>Contacts extraits</span>
                    </div>
                    <div class="stat-box">
                        <strong id="statWritten">0</strong>
                        <span>Contacts écrits</span>
                    </div>
                    <div class="stat-box">
                        <strong id="statPerimetres">0</strong>
                        <span>Max périmètres</span>
                    </div>
                    <div class="stat-box">
                        <strong id="statErrors">0</strong>
                        <span>Erreurs</span>
                    </div>
                </div>

                <div id="alertsSection">
                    <h3>⚠️ Profils avec trop de périmètres</h3>
                    <div id="alertsList"></div>
                </div>

                <div class="button-group">
                    <button id="resetBtn">↻ Nouvelle extraction</button>
                </div>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
